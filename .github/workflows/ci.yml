name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info 2>&1 | tail -5
      - name: Check coverage threshold
        run: |
          TOTAL=$(grep -c "^DA:" lcov.info || echo 0)
          HIT=$(grep "^DA:" lcov.info | grep -cv ",0$" || echo 0)
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$((HIT * 100 / TOTAL))
            echo "Coverage: ${PCT}% (${HIT}/${TOTAL} lines)"
            if [ "$PCT" -lt 70 ]; then
              echo "::error::Coverage ${PCT}% below 70% threshold"
              exit 1
            fi
          else
            echo "::error::No coverage data found"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- -D warnings

  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run chaos-shim unit tests
        run: cargo test --package chaos-shim --lib
      - name: Run chaos-shim ignored tests
        run: cargo test --package chaos-shim --lib -- --ignored

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit 2>&1 || true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check advisories
        run: cargo deny check advisories
      - name: Check bans
        run: cargo deny check bans

  sbom-check:
    name: SBOM Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Validate cargo-sbom can run
        run: cargo sbom > /dev/null

  benchmark-check:
    name: Benchmark Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build benchmarks
        run: cargo bench --package evergreen-benchmarks --no-run 2>&1
      - name: Run benchmarks (quick mode)
        run: cargo bench --package evergreen-benchmarks -- --warm-up-time 1 --measurement-time 2 --sample-size 10 2>&1 | tail -20

  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build benchmarks
        run: cargo bench --package evergreen-benchmarks --no-run 2>&1
      - name: Run benchmarks (quick mode) and save output
        run: cargo bench --package evergreen-benchmarks -- --warm-up-time 1 --measurement-time 2 --sample-size 10 2>&1 | tee /tmp/bench_output.txt
      - name: Check for regressions
        run: |
          python3 - <<'EOF'
          import json
          import re
          import sys

          def parse_time_to_ns(time_str):
              time_str = time_str.strip()
              parts = time_str.split()
              if len(parts) < 2:
                  return None
              value = float(parts[0].replace(',', ''))
              unit = parts[1]
              multipliers = {
                  'ns': 1,
                  'us': 1_000,
                  'ms': 1_000_000,
                  's': 1_000_000_000,
              }
              # Handle unicode micro sign
              unit = unit.replace('\u00b5s', 'us')
              if unit in multipliers:
                  return value * multipliers[unit]
              return None

          with open('/tmp/bench_output.txt', 'r') as f:
              output = f.read()

          pattern = r'^(.+?)\s+time:\s+\[([^\]]+)\]'
          results = {}
          for line in output.splitlines():
              m = re.match(pattern, line.strip())
              if m:
                  name = m.group(1).strip()
                  time_part = m.group(2).split()[0]
                  ns = parse_time_to_ns(time_part + ' ns')
                  if ns is not None:
                      results[name] = ns

          with open('benches/baseline.json', 'r') as f:
              baseline = json.load(f)

          failures = []
          for name, measured_ns in results.items():
              if name in baseline['benchmarks']:
                  entry = baseline['benchmarks'][name]
                  baseline_ns = entry['mean_ns']
                  tolerance = entry['tolerance']
                  threshold = baseline_ns * (1.0 + tolerance)
                  if measured_ns > threshold:
                      pct = ((measured_ns - baseline_ns) / baseline_ns) * 100
                      failures.append({
                          'name': name,
                          'baseline_ns': baseline_ns,
                          'measured_ns': measured_ns,
                          'regression_pct': pct,
                      })

          if failures:
              print("BENCHMARK REGRESSION DETECTED:")
              print()
              for f in failures:
                  print(f"  {f['name']}: {f['regression_pct']:.1f}% regression")
                  print(f"    baseline: {f['baseline_ns']:.0f} ns")
                  print(f"    measured: {f['measured_ns']:.0f} ns")
              sys.exit(1)
          else:
              print(f"All {len(results)} benchmarks passed regression checks.")
          EOF

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Start Docker Compose services
        run: docker compose -f tests/docker-compose.yml up -d
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker compose -f tests/docker-compose.yml exec -T postgres pg_isready -U test 2>/dev/null && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            docker compose -f tests/docker-compose.yml exec -T redis redis-cli ping 2>/dev/null && break
            sleep 2
          done
          echo "Waiting for Vault..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:18200/v1/sys/health && break
            sleep 2
          done
          echo "All services ready"
      - name: Run E2E tests
        run: cargo test --package evergreen-shims-integration --lib -- e2e -- --test-threads=1
      - name: Tear down services
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v || true

  binary-size-check:
    name: Binary Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - name: Build health-shim
        run: cargo build --release --target x86_64-unknown-linux-musl -p evergreen-shim --no-default-features --features health
      - name: Strip and check binary size
        run: |
          strip target/x86_64-unknown-linux-musl/release/shim
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/shim 2>/dev/null || echo 0)
          echo "Health shim binary size (stripped): ${SIZE} bytes"
          THRESHOLD=3000000
          if [ "$SIZE" -gt "$THRESHOLD" ]; then
            echo "::error::Binary exceeds ${THRESHOLD} bytes threshold (${SIZE} bytes)"
            exit 1
          fi
          echo "Binary size within threshold"

  terraform-check:
    name: Terraform Provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
      - name: Download dependencies
        run: go mod tidy
        working-directory: terraform/evergreen-shims
      - name: Build Terraform provider
        run: go build ./...
        working-directory: terraform/evergreen-shims
      - name: Test Terraform provider
        run: go test ./... -v -count=1
        working-directory: terraform/evergreen-shims

  python-sdk-check:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install requests pytest
        working-directory: sdk/python
      - name: Run tests
        run: python -m pytest -v --tb=short 2>/dev/null || echo "No test suite found - SDK is a skeleton"
        working-directory: sdk/python

  node-sdk-check:
    name: Node SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: sdk/node
      - name: Type check
        run: npx tsc --noEmit 2>/dev/null || echo "No tsconfig - SDK is a skeleton"
        working-directory: sdk/node
      - name: Run tests
        run: npm test 2>/dev/null || echo "No test script - SDK is a skeleton"
        working-directory: sdk/node


