name: Build Shim Images

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.shim-image'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  OWNER: wyattau/evergreenshim

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - variant: health-shim
            features: health
            target: shim-health
          - variant: db-shim
            features: db-shim
            target: shim-db
          - variant: cache-shim
            features: cache-shim-combo
            target: shim-cache
          - variant: evergreen-shim
            features: full
            target: shim-full
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shim-image
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: |
            FEATURES=${{ matrix.features }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:v${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Scan ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - variant: health-shim
          - variant: db-shim
          - variant: cache-shim
          - variant: evergreen-shim
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  sign:
    name: Sign Images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - variant: health-shim
          - variant: db-shim
          - variant: cache-shim
          - variant: evergreen-shim
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:latest
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:${{ github.sha }}
