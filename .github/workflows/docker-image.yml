name: Build Shim Images

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.shim-image'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase; github.repository_owner may have uppercase
  OWNER: wyattau/evergreenshim

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.features }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: health-shim
            features: health
            target: shim-health
          - variant: db-shim
            features: db-shim
            target: shim-db
          - variant: cache-shim
            features: cache-shim-combo
            target: shim-cache
          - variant: evergreen-shim
            features: full
            target: shim-full
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shim-image
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: |
            FEATURES=${{ matrix.features }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.variant }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
