name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # x86_64 presets (musl static, all stripped)
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            features: health
            artifact: shim
          - target: x86_64-unknown-linux-musl
            arch: x86_64-infra
            features: infra
            artifact: shim-infra
          - target: x86_64-unknown-linux-musl
            arch: x86_64-full
            features: full
            artifact: shim-full
          - target: x86_64-unknown-linux-musl
            arch: x86_64-db
            features: db-shim
            artifact: shim-db
          - target: x86_64-unknown-linux-musl
            arch: x86_64-cache
            features: cache-shim-combo
            artifact: shim-cache
          # aarch64 presets (musl static, all stripped)
          # NOTE: aarch64-infra/full excluded — aws-lc-rs doesn't cross-compile for aarch64-musl
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            features: health
            artifact: shim-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            rustup target add aarch64-unknown-linux-musl
            # Install cross-strip for aarch64 binaries
            sudo apt-get install -y binutils-aarch64-linux-gnu
          fi

      - name: Build
        run: |
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            cargo build --release --target ${{ matrix.target }} \
              -p evergreen-shim --no-default-features --features ${{ matrix.features }} \
              --config "target.aarch64-unknown-linux-musl.linker='aarch64-linux-gnu-gcc'"
          else
            cargo build --release --target ${{ matrix.target }} \
              -p evergreen-shim --no-default-features --features ${{ matrix.features }}
          fi

      - name: Strip and package
        run: |
          cp target/${{ matrix.target }}/release/shim ${{ matrix.artifact }}
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            aarch64-linux-gnu-strip ${{ matrix.artifact }}
          else
            strip ${{ matrix.artifact }}
          fi
          gzip ${{ matrix.artifact }}
          echo "BINARY=${{ matrix.artifact }}.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
