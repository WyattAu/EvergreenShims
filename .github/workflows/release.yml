name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            features: health
            artifact: shim
          - target: x86_64-unknown-linux-musl
            arch: x86_64-infra
            features: infra
            artifact: shim-infra
          - target: x86_64-unknown-linux-musl
            arch: x86_64-full
            features: full
            artifact: shim-full
          - target: x86_64-unknown-linux-musl
            arch: x86_64-db
            features: db-shim
            artifact: shim-db
          - target: x86_64-unknown-linux-musl
            arch: x86_64-cache
            features: cache-shim-combo
            artifact: shim-cache
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            features: health
            artifact: shim-aarch64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            rustup target add aarch64-unknown-linux-musl
            sudo apt-get install -y binutils-aarch64-linux-gnu
          fi

      - name: Build
        run: |
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            cargo build --release --target ${{ matrix.target }} \
              -p evergreen-shim --no-default-features --features ${{ matrix.features }} \
              --config "target.aarch64-unknown-linux-musl.linker='aarch64-linux-gnu-gcc'"
          else
            cargo build --release --target ${{ matrix.target }} \
              -p evergreen-shim --no-default-features --features ${{ matrix.features }}
          fi

      - name: Strip and package
        run: |
          cp target/${{ matrix.target }}/release/shim ${{ matrix.artifact }}
          if [[ "${{ matrix.arch }}" == aarch64* ]]; then
            aarch64-linux-gnu-strip ${{ matrix.artifact }}
          else
            strip ${{ matrix.artifact }}
          fi
          gzip ${{ matrix.artifact }}
          echo "BINARY=${{ matrix.artifact }}.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          files: artifacts/**/*.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Generate Checksums
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download all release assets
        run: gh release download "${{ github.ref_name }}" --pattern "*.gz" --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.gz > SHA256SUMS.txt
          echo "SHA-256 checksums:"
          cat SHA256SUMS.txt

      - name: Upload checksums to release
        run: gh release upload "${{ github.ref_name }}" dist/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - name: Generate SBOM
        run: cargo sbom > sbom.spdx

      - name: Upload SBOM to release
        run: gh release upload "${{ github.ref_name }}" sbom.spdx --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    name: Generate Provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae455a06f29a22f4c548f2 # v2.3.0
        with:
          subject-path: './crates/evergreen-shim/Cargo.toml'

      - name: Upload provenance to release
        run: |
          cat attestation.json > provenance.json
          gh release upload "${{ github.ref_name }}" provenance.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
