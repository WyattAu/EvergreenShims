apiVersion: v1
kind: Namespace
metadata:
  name: evergreen-system
  labels:
    app.kubernetes.io/name: evergreen-operator
    app.kubernetes.io/part-of: evergreen-shims
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evergreen-operator
  namespace: evergreen-system
  labels:
    app.kubernetes.io/name: evergreen-operator
    app.kubernetes.io/part-of: evergreen-shims
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evergreen-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evergreen-operator
        app.kubernetes.io/part-of: evergreen-shims
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: evergreen-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: operator
          image: ghcr.io/wyattau/evergreen-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-addr=:8080
            - --leader-elect
            - --health-probe-bind-addr=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: EVERGREEN_LOG_LEVEL
              value: "info"
            - name: EVERGREEN_JSON_LOGGING
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      nodeSelector:
        kubernetes.io/os: linux
