# cargo-deny configuration for EvergreenShims
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[advisories]
ignore = [
    # instant is unmaintained (transitive dep of notify v7), no security impact
    "RUSTSEC-2024-0384",
    # protobuf 2.x transitive dep of tonic/gRPC; upgrade to v3 requires tonic major bump
    "RUSTSEC-2024-0437",
    # RSA Marvin Attack timing side-channel; no fix available, RSA not used in our TLS stack
    "RUSTSEC-2023-0071",
    # rustls-pemfile unmaintained; no vulnerability, actively maintained fork TBD
    "RUSTSEC-2025-0134",
    # rustls-webpki 0.101.x URI name constraint issue; old version from acme-micro, not our TLS path
    "RUSTSEC-2026-0098",
    # rustls-webpki 0.101.x wildcard name constraint issue; same as above
    "RUSTSEC-2026-0099",
    # rustls-webpki 0.101.x CRL parsing panic; same as above
    "RUSTSEC-2026-0104",
    # backoff unmaintained; no vulnerability, used for retry logic only
    "RUSTSEC-2025-0012",
    # derivative unmaintained; no vulnerability, derive macro still works
    "RUSTSEC-2024-0388",
    # h2 0.3.x unbounded empty DATA frames (low severity); fix only exists on 0.4.x.
    # This 0.3 line comes via the AWS SDK legacy HTTP client (aws-smithy-http-client),
    # which cannot move to h2 0.4 within semver. The h2 0.4.x line we use elsewhere
    # is patched (0.4.19) and kept above the fix via Cargo.lock.
    # TODO: drop this ignore when aws-sdk bumps aws-smithy-http-client to a hyper-1.x client.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3-only path via AWS SDK legacy client; no fixed 0.3 release, tracked for removal" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
