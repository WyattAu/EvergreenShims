[package]
name = "cloud-metadata-plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cloud metadata plugin for EvergreenShim - fetches instance metadata from cloud providers"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls-no-provider"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
