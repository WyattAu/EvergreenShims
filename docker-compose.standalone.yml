# docker-compose.standalone.yml
# Quickstart: docker compose -f docker-compose.standalone.yml up -d
# Then: curl http://localhost:9101/livez

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: test
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  health-shim:
    image: ghcr.io/wyattau/evergreenshim/health-shim:latest
    ports:
      - "9101:9101"
    environment:
      HEALTH_LISTEN: "0.0.0.0:9101"
      HEALTH_CMD: "exec:/usr/bin/sleep infinity"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
