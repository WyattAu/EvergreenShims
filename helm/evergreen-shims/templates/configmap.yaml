apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evergreen-shims.fullname" . }}
  labels:
    {{- include "evergreen-shims.labels" . | nindent 4 }}
data:
  config.toml: |
    # EvergreenShims configuration
    # Generated by Helm - do not edit directly

    [health]
    listen = {{ .Values.health.listen | quote }}

    {{- if .Values.proxy.enabled }}
    [proxy]
    listen = {{ .Values.proxy.listen | quote }}
    target = {{ .Values.proxy.target | quote }}
    max_connections = {{ .Values.proxy.maxConnections }}
    min_idle = {{ .Values.proxy.minIdle }}
    max_lifetime_secs = {{ .Values.proxy.maxLifetimeSecs }}
    idle_timeout_secs = {{ .Values.proxy.idleTimeoutSecs }}
    connect_timeout = {{ .Values.proxy.connectTimeout }}
    retry_attempts = {{ .Values.proxy.retryAttempts }}
    retry_base_ms = {{ .Values.proxy.retryBaseMs }}
    circuit_threshold = {{ .Values.proxy.circuitThreshold }}
    circuit_reset_secs = {{ .Values.proxy.circuitResetSecs }}
    graceful_degradation = {{ .Values.proxy.gracefulDegradation }}
    {{- end }}

    {{- if .Values.failover.enabled }}
    [failover]
    primary = {{ .Values.failover.primary | quote }}
    replica = {{ .Values.failover.replica | quote }}
    check_interval = {{ .Values.failover.checkInterval }}
    timeout = {{ .Values.failover.timeout }}
    failure_threshold = {{ .Values.failover.failureThreshold }}
    db_type = {{ .Values.failover.dbType | quote }}
    connector = {{ .Values.failover.connector | quote }}
    {{- end }}

    {{- if .Values.config.enabled }}
    [config]
    path = {{ .Values.config.path | quote }}
    watch = {{ .Values.config.watch }}
    reload_signal = {{ .Values.config.reloadSignal | quote }}
    reload_debounce = {{ .Values.config.reloadDebounce }}
    keep_backup = {{ .Values.config.keepBackup }}
    {{- if .Values.config.validateCmd }}
    validate_cmd = {{ .Values.config.validateCmd | quote }}
    {{- end }}
    {{- end }}
