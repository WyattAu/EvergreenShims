apiVersion: v1
kind: Service
metadata:
  name: {{ include "evergreen-shims.fullname" . }}
  labels:
    {{- include "evergreen-shims.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "evergreen-shims.selectorLabels" . | nindent 4 }}
