[workspace]
members = [
    "crates/shim-core",
    "crates/health-shim",
    "crates/vault-shim",
    "crates/backup-shim",
    "crates/migration-shim",
    "crates/audit-shim",
    "crates/proxy-shim",
    "crates/tls-shim",
    "crates/config-shim",
    "crates/failover-shim",
    "crates/replication-shim",
    "crates/cache-shim",
    "crates/cdc-shim",
    "crates/sharding-shim",
    "crates/archival-shim",
    "crates/auth-shim",
    "crates/encryption-shim",
    "crates/compliance-shim",
    "crates/scheduler-shim",
    "crates/queue-shim",
    "crates/alerting-shim",
    "crates/chaos-shim",
    "crates/cost-shim",
    "crates/evergreen-shim",
    "crates/integration-tests",
    "crates/mongodb-shim",
    "crates/cockroachdb-shim",
    "crates/dynamodb-shim",
    "crates/elasticsearch-shim",
    "crates/cassandra-shim",
    "crates/benchmarks",
    "crates/management-api",
    "crates/shimctl",
    "crates/shim-plugin",
    "crates/shim-operator",
]
resolver = "2"
exclude = ["examples/custom-shim-plugin", "examples/cloud-metadata-plugin"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["WyattAu"]
license = "Apache-2.0"
repository = "https://github.com/WyattAu/EvergreenShims"
description = "Rust-native shims for building self-managing container images"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP/Networking (ring-free: uses aws-lc-rs for musl static builds)
reqwest = { version = "0.12", features = ["json", "rustls-tls-no-provider", "http2"], default-features = false }
axum = "0.7"
tower = "0.5"
hyper = { version = "1", features = ["full"] }

# Metrics
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"

# Database (ring-free: uses aws-lc-rs for musl static builds)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "mysql"] }
deadpool-postgres = "0.14"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
criterion = { version = "0.5", features = ["html_reports"] }

# AWS/Cloud
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"

# TLS (ring-free: aws-lc-rs provider)
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pemfile = "2"
acme-micro = "0.13"
rcgen = "0.13"

# Process management
nix = { version = "0.29", features = ["signal", "process"] }

# Scheduling
cron = "0.13"

# Cryptography
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
futures = "0.3"
pin-project = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
parking_lot = "0.12"
regex = "1"

# WASM runtime
wasmtime = { version = "28", features = ["cranelift", "async"] }

# Testing (used by individual crates)
tempfile = "3"
pretty_assertions = "1"
tokio-test = "0.4"
temp-env = "0.3"
serial_test = "3"

# Release profile: optimize for small binaries
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

# Supported cross-compilation targets:
# - x86_64-unknown-linux-musl (default, x86_64)
# - aarch64-unknown-linux-musl (ARM 64-bit)
# - riscv64gc-unknown-linux-musl (RISC-V 64-bit, edge devices)

# Benchmark profile: optimize for speed
[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
