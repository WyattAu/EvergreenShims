[package]
name = "fuzz-targets"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "0.8"
chacha20poly1305 = "0.9"

[dependencies.migration-shim]
path = "../crates/migration-shim"

[dependencies.cdc-shim]
path = "../crates/cdc-shim"

[dependencies.config-shim]
path = "../crates/config-shim"

[[bin]]
name = "fuzz_migration_parse_version"
path = "fuzz_targets/fuzz_migration_parse_version.rs"
test = false
doc = false

[[bin]]
name = "fuzz_migration_parse_name"
path = "fuzz_targets/fuzz_migration_parse_name.rs"
test = false
doc = false

[[bin]]
name = "fuzz_migration_compute_checksum"
path = "fuzz_targets/fuzz_migration_compute_checksum.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cdc_operation_from_str"
path = "fuzz_targets/fuzz_cdc_operation_from_str.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cdc_event_deserialize"
path = "fuzz_targets/fuzz_cdc_event_deserialize.rs"
test = false
doc = false

[[bin]]
name = "fuzz_config_toml_parse"
path = "fuzz_targets/fuzz_config_toml_parse.rs"
test = false
doc = false
