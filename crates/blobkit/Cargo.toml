[package]
name = "blobkit"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Unified blob storage — trait + Memory + Local + S3 (aws-sdk-s3). Replaces S3Client::from_conf duplication."
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/blobkit"
keywords = ["storage", "s3", "blob", "object"]
categories = ["filesystem"]
exclude = ["/target"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util"] }
async-trait = "0.1"
thiserror = { version = "2", default-features = false }
bytes = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
dashmap = { version = "6", optional = true }
tracing = { version = "0.1", optional = true }
tempfile = "3"
mime_guess = { version = "2", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
aws-smithy-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[features]
default = ["std", "memory"]
std = ["thiserror/std", "tokio/io-util", "tokio/fs", "tokio/sync"]
serde = ["dep:serde", "dep:serde_json"]
chrono = ["dep:chrono"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-types", "dep:aws-smithy-runtime-api", "dep:url"]
memory = ["dep:dashmap"]
sha2 = ["dep:sha2"]
typed-id = ["dep:uuid"]
tracing = ["dep:tracing"]
io-uring = ["dep:io-uring", "std"]

[[bench]]
name = "blob_bench"
harness = false

[[bench]]
name = "io_uring_bench"
harness = false
required-features = ["io-uring"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
