[package]
name = "loop-retry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generic async retry with exponential backoff and jitter"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/loop-retry"
keywords = ["retry", "backoff", "async"]
categories = ["rust-patterns"]

[dependencies]
tokio = { version = "1", features = ["time"] }
rand = "0.9"
thiserror = "2"
tracing = { version = "0.1", optional = true }

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "retry_bench"
harness = false
